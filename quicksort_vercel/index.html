<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sort Puzzle 3D</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; width: 100vw; height: 100vh; background: #87CEEB; font-family: 'Segoe UI', sans-serif; touch-action: none; }
        #root { width: 100%; height: 100%; touch-action: none; }
        * { user-select: none; -webkit-user-select: none; }
    </style>
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@18.2.0",
          "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
          "three": "https://esm.sh/three@0.160.0",
          "@react-three/fiber": "https://esm.sh/@react-three/fiber@8.15.12?external=react,react-dom,three",
          "@react-three/drei": "https://esm.sh/@react-three/drei@9.96.1?external=react,react-dom,three,@react-three/fiber",
          "@react-spring/three": "https://esm.sh/@react-spring/three@9.7.3?external=react,react-dom,three,@react-three/fiber"
        }
      }
    </script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel" data-type="module">
        import React, { useState, useRef, useEffect, useMemo } from 'react';
        import { createRoot } from 'react-dom/client';
        import { Canvas, useFrame } from '@react-three/fiber';
        import { Text, Sky } from '@react-three/drei';
        import { useSpring, a } from '@react-spring/three';

        const Duck = ({ id, value, xPos, isDragging, dragX, onPointerDown }) => {
          const groupRef = useRef();
          
          const { pos } = useSpring({
            pos: [isDragging ? dragX : xPos, isDragging ? 1.5 : 0.05, 0],
            config: { mass: 1, tension: 400, friction: 30 }
          });

          useFrame((state) => {
            if (groupRef.current && !isDragging) {
                groupRef.current.position.y = Math.sin(state.clock.elapsedTime * 2 + value) * 0.05;
            }
          });

          return (
            <a.group position={pos}>
              <group ref={groupRef} onPointerDown={(e) => onPointerDown(id, e)} onPointerEnter={() => document.body.style.cursor = 'grab'} onPointerLeave={() => document.body.style.cursor = 'default'}>
                <mesh position={[0, 0.45, 0]} castShadow>
                  <sphereGeometry args={[0.6, 32, 32]} />
                  <meshStandardMaterial color="#ffd700" roughness={0.4} />
                </mesh>
                <mesh position={[0, 0.95, 0.4]} castShadow>
                  <sphereGeometry args={[0.35, 32, 32]} />
                  <meshStandardMaterial color="#ffd700" roughness={0.4} />
                </mesh>
                <mesh position={[0, 0.95, 0.75]} rotation={[Math.PI/2, 0, 0]} castShadow>
                  <coneGeometry args={[0.15, 0.4, 16]} />
                  <meshStandardMaterial color="#ff8c00" />
                </mesh>
                
                <mesh position={[0.15, 1.05, 0.65]}>
                    <sphereGeometry args={[0.06, 16, 16]} />
                    <meshBasicMaterial color="black" />
                </mesh>
                <mesh position={[-0.15, 1.05, 0.65]}>
                    <sphereGeometry args={[0.06, 16, 16]} />
                    <meshBasicMaterial color="black" />
                </mesh>

                <Text position={[0, 2.0, 0]} fontSize={0.8} color="black" outlineWidth={0.05} outlineColor="white" fontWeight="bold">
                  {value}
                </Text>
              </group>
            </a.group>
          );
        };

        const shuffleArray = (array) => {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        };
        const initialArr = shuffleArray([1, 2, 3, 4, 5, 6, 7, 8]);
        
        function App() {
          const [ducks, setDucks] = useState(
              initialArr.map((v, i) => ({ id: `duck-${v}`, value: v, posIdx: i }))
          );
          const [draggingDuck, setDraggingDuck] = useState(null);
          const [dragX, setDragX] = useState(0);

          const hills = useMemo(() => [-4, -2, 0, 2, 4].map(i => ({
              pos: i * 8,
              size: 8 + Math.random() * 4
          })), []);

          const handlePointerDown = (id, e) => {
              e.stopPropagation();
              setDraggingDuck(id);
              setDragX(e.point.x);
              document.body.style.cursor = 'grabbing';
          };

          const handlePointerMove = (e) => {
              if (draggingDuck) {
                  e.stopPropagation();
                  setDragX(e.point.x);
              }
          };

          const handlePointerUp = (e) => {
              if (draggingDuck) {
                  e.stopPropagation();
                  document.body.style.cursor = 'default';
                  
                  let nearestIdx = Math.round(dragX / 2 + 3.5);
                  if (nearestIdx < 0) nearestIdx = 0;
                  if (nearestIdx > 7) nearestIdx = 7;
                  
                  setDucks(prev => {
                      const next = [...prev];
                      const dragDuck = next.find(d => d.id === draggingDuck);
                      const targetDuck = next.find(d => d.posIdx === nearestIdx);
                      
                      if (targetDuck && targetDuck.id !== dragDuck.id) {
                          targetDuck.posIdx = dragDuck.posIdx;
                      }
                      dragDuck.posIdx = nearestIdx;
                      
                      return next;
                  });
                  setDraggingDuck(null);
              }
          };
          
          const isSorted = ducks.slice().sort((a,b) => a.posIdx - b.posIdx).every((d, i, arr) => {
              if (i === 0) return true;
              return d.value >= arr[i-1].value;
          });

          useEffect(() => {
              if (isSorted) {
                  confetti({
                      particleCount: 200,
                      spread: 100,
                      origin: { y: 0.5 },
                      zIndex: 1000
                  });
              }
          }, [isSorted]);

          return (
            <React.Fragment>
              <Canvas shadows camera={{ position: [0, 10, 18], fov: 45 }}>
                <color attach="background" args={['#87CEEB']} />
                <Sky sunPosition={[20, 25, -30]} />
                <ambientLight intensity={0.6} />
                <directionalLight position={[10, 20, 10]} castShadow intensity={1.5} shadow-mapSize={2048}>
                    <orthographicCamera attach="shadow-camera" args={[-20, 20, 10, -10]} />
                </directionalLight>

                {draggingDuck && (
                    <mesh 
                        position={[0, 1.5, 0]} 
                        onPointerMove={handlePointerMove} 
                        onPointerUp={handlePointerUp}
                        onPointerLeave={handlePointerUp}
                    >
                        <planeGeometry args={[1000, 1000]} />
                        <meshBasicMaterial transparent opacity={0} depthWrite={false} />
                    </mesh>
                )}

                <mesh rotation={[-Math.PI/2, 0, 0]} position={[0, -0.05, 0]} receiveShadow>
                    <planeGeometry args={[200, 200]} />
                    <meshStandardMaterial color="#3ab0ff" roughness={0.1} />
                </mesh>
                
                {hills.map((h, i) => (
                    <mesh key={`hill-${i}`} position={[h.pos, -3, -20]} receiveShadow>
                        <icosahedronGeometry args={[h.size, 1]} />
                        <meshStandardMaterial color="#58c358" roughness={0.9} flatShading />
                    </mesh>
                ))}
                
                {initialArr.map((_, i) => (
                    <mesh key={`pad-${i}`} position={[(i - 3.5) * 2, 0, 0]} receiveShadow>
                        <cylinderGeometry args={[1.2, 1.2, 0.1, 16]} />
                        <meshStandardMaterial color="#44aa44" />
                    </mesh>
                ))}

                {ducks.map(d => (
                    <Duck 
                        key={d.id} 
                        id={d.id}
                        value={d.value} 
                        xPos={(d.posIdx - 3.5) * 2}
                        isDragging={draggingDuck === d.id}
                        dragX={dragX}
                        onPointerDown={handlePointerDown}
                    />
                ))}
              </Canvas>
              
              {isSorted && (
                  <div style={{ position: 'absolute', top: 30, left: '50%', transform: 'translateX(-50%)', background: '#4CAF50', color: 'white', padding: '15px 30px', borderRadius: 20, fontSize: 24, fontWeight: 'bold', boxShadow: '0 4px 15px rgba(0,0,0,0.2)', pointerEvents: 'none', zIndex: 100, textAlign: 'center', width: '80%' }}>
                      Керемет! Үйректер сұрыпталды! 🎉
                  </div>
              )}
              
              {!isSorted && (
                  <div style={{ position: 'absolute', top: 30, left: '50%', transform: 'translateX(-50%)', background: 'rgba(255,255,255,0.9)', color: '#333', padding: '10px 20px', borderRadius: 20, fontSize: 16, fontWeight: 'bold', boxShadow: '0 4px 15px rgba(0,0,0,0.1)', pointerEvents: 'none', zIndex: 100, textAlign: 'center', width: '80%' }}>
                      Үйректерді өсу ретімен сұрыптау үшін оларды жылжытыңыз
                  </div>
              )}
            </React.Fragment>
          );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
